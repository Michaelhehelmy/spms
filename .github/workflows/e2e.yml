name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Create app venv (.venv-build)
        run: |
          python -m venv .venv-build
          .venv-build/bin/pip install --require-hashes -r requirements/runtime-linux-cp312.txt
          .venv-build/bin/pip install --require-hashes -r requirements/dev-linux-cp312.txt
          .venv-build/bin/pip install -q playwright==1.65.2

      - name: Install Chromium
        run: .venv-build/bin/python -m playwright install chromium --with-deps

      - name: Run Playwright E2E suite
        run: .venv-build/bin/python -m pytest tests/e2e -q

      - name: Upload failure artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-artifacts
          path: dist/e2e-artifacts
          retention-days: 7
