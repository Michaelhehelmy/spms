name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Create app venv (.venv-build)
        run: |
          python -m venv .venv-build
          .venv-build/bin/pip install --require-hashes -r requirements/runtime-linux-cp312.txt
          .venv-build/bin/pip install --require-hashes -r requirements/dev-linux-cp312.txt
          .venv-build/bin/pip install --require-hashes -r requirements/e2e-linux-cp312.txt

      - name: Install Chromium
        run: .venv-build/bin/python -m playwright install chromium --with-deps

      - name: Run Playwright E2E suite
        run: .venv-build/bin/python -m pytest tests/e2e -q

      - name: Upload failure artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-artifacts
          path: dist/e2e-artifacts
          retention-days: 7
